services:
  isaac-sim:
    build:
      target: turtlebot3
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: isaac-sim-ros2:5.1.0-jazzy
    container_name: isaac-sim
    # Uses ENTRYPOINT from Dockerfile which sources ROS2 and starts headless by default
    # Override with: docker compose run isaac-sim <your-command>
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
    network_mode: host
    volumes:
      - ./docker/isaac-sim/cache/main:/isaac-sim/.cache:rw
      - ./docker/isaac-sim/cache/computecache:/isaac-sim/.nv/ComputeCache:rw
      - ./docker/isaac-sim/logs:/isaac-sim/.nvidia-omniverse/logs:rw
      - ./docker/isaac-sim/config:/isaac-sim/.nvidia-omniverse/config:rw
      - ./docker/isaac-sim/data:/isaac-sim/.local/share/ov/data:rw
      - ./docker/isaac-sim/pkg:/isaac-sim/.local/share/ov/pkg:rw
    # user: "1234:1234"  # Commented out to allow SSH login as root or another user
    stdin_open: true
    tty: true
    restart: "no"

  openssh-server:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: openssh-server
    hostname: openssh-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # - PUBLIC_KEY= # No public key, password only
      - SUDO_ACCESS=true
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=changeme
      - USER_NAME=sshuser
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # - /path/to/openssh-server/config:/config  # Optional: persistent config
    ports:
      - 22:2222
    # network_mode: host
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    depends_on:
      # - isaac-sim
      - openssh-server
    environment:
      - CF_TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN} --url ssh://localhost:22
    restart: unless-stopped
    network_mode: host
